[env]
X_OPENCODE_SESSION="youtube-feed-to-markdown/0.1"
OPENAIAPI_MODEL_ID="mimo-v2.5"
OPENAIAPI_ENDPOINT="https://opencode.ai/zen/go/v1/chat/completions"
OPENAIAPI_CONCURRENCY="6"
YTDLP_CONCURRENCY="2"
_.source = ".secret.sh"

[tools]
yt-dlp = "2026.08.19"
deno = "2.9.7"

[tasks.extract-video-metadata]
description = "Alimente les listes videos de feed.yaml depuis les chaînes YouTube"
run = "scripts/extract-video-metadata.js"

[tasks.download_vtt]
description = "Télécharge les transcripts VTT des vidéos marquées download_vtt"
run = "scripts/download-vtt.js"

[tasks.generate_markdown]
description = "Transforme les transcripts VTT en prose Markdown via ai-sdk"
run = "scripts/generate-markdown.js"

[tasks.markdown_stats]
description = "Rapport global (tokens, coût, temps) depuis les frontmatter de contents/"
run = "scripts/markdown-stats.js"
