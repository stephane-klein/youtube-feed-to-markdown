[env]
_.source = ".secret.sh"

[[hooks.enter]]
shell = "zsh"
script = [
  "unalias youtube-to-markdown 2>/dev/null || true",
  "youtube-to-markdown() { node {{config_root | quote}}/src/cli.js \"$@\"; }",
  "source <(SHELL=/bin/zsh node {{config_root | quote}}/src/cli.js completion)",
]

[[hooks.enter]]
shell = "bash"
script = [
  "unalias youtube-to-markdown 2>/dev/null || true",
  "youtube-to-markdown() { node {{config_root | quote}}/src/cli.js \"$@\"; }",
  "source <(SHELL=/bin/bash node {{config_root | quote}}/src/cli.js completion)",
]

[[hooks.leave]]
shell = "zsh"
script = "unalias youtube-to-markdown 2>/dev/null || true; unfunction youtube-to-markdown 2>/dev/null; unfunction _youtube-to-markdown_yargs_completions 2>/dev/null; compdef -d youtube-to-markdown 2>/dev/null"

[[hooks.leave]]
shell = "bash"
script = "unalias youtube-to-markdown 2>/dev/null || true; unset -f youtube-to-markdown 2>/dev/null; complete -r youtube-to-markdown 2>/dev/null"

[tools]
yt-dlp = "2026.08.19"
node = "24.21.0"

[tasks.publish-to-npmjs]
description = "Publish the package to npmjs"
run = """
#!/usr/bin/env bash
set -euo pipefail
npm whoami
npm publish
"""
